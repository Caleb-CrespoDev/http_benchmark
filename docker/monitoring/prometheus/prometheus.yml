global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["localhost:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["localhost:9187"]

  # down whenever neither app profile is running — apps are one-at-a-time
  - job_name: bench-app
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:4000"]
