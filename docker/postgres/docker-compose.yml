services:
  postgres:
    image: postgres:18.4
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: bench
      POSTGRES_DB: bench
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /opt/bench/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 5s
      timeout: 5s
      retries: 10
